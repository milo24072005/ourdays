<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d0b">
  <title>♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#090d0b;
      --screen:#0b110e;
      --mint:#8dffd9;
      --mint-dim:rgba(141,255,217,.66);
      --mint-faint:rgba(141,255,217,.13);
      --red:#ff8090;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{
      width:100%;
      min-height:100%;
      background:var(--bg);
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      overflow:hidden;
      font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
      color:var(--mint);
      -webkit-font-smoothing:antialiased;
    }

    .hidden{display:none!important}

    /* ---------- CRT OPENING ---------- */

    #boot{
      position:fixed;
      inset:0;
      min-height:100vh;
      min-height:100dvh;
      background:
        radial-gradient(circle at 50% 42%, rgba(40,70,58,.12), transparent 52%),
        #070a08;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        max(16px,env(safe-area-inset-top))
        14px
        max(16px,env(safe-area-inset-bottom));
    }

    .crt{
      position:relative;
      width:min(100%,430px);
      height:min(88dvh,760px);
      min-height:560px;
      overflow:hidden;
      border-radius:36px / 58px;
      background:
        radial-gradient(ellipse at 50% 45%,
          #132119 0%,
          #0b120f 52%,
          #050706 100%);
      box-shadow:
        inset 0 0 48px rgba(0,0,0,.78),
        inset 0 0 105px rgba(0,0,0,.62),
        0 24px 80px rgba(0,0,0,.5);
      transform:perspective(850px) rotateX(.8deg) scaleX(.962) scaleY(1.018);
      animation:screenLife 5.3s ease-in-out infinite;
    }

    .content{
      position:relative;
      z-index:3;
      height:100%;
      padding:58px 29px 42px;
    }

    #title{
      font-size:13px;
      line-height:1.55;
      font-weight:600;
      letter-spacing:.09em;
      color:var(--mint);
      text-shadow:
        0 0 4px rgba(141,255,217,.86),
        0 0 12px rgba(141,255,217,.22);
      opacity:0;
      transform:translateY(3px);
      animation:titleIn .65s ease .28s forwards;
    }

    .terminal{
      margin-top:86px;
      width:100%;
    }

    #status{
      min-height:3.8em;
      font-size:12.5px;
      line-height:1.75;
      font-weight:500;
      letter-spacing:.005em;
      color:var(--mint);
      text-shadow:
        0 0 4px rgba(141,255,217,.88),
        0 0 10px rgba(141,255,217,.18);
    }

    .prompt{
      margin-right:7px;
      opacity:.9;
    }

    #cursor{
      display:inline-block;
      margin-left:2px;
      animation:blink .72s steps(1,end) infinite;
      text-shadow:0 0 7px rgba(141,255,217,.85);
    }

    #value{
      min-height:2em;
      margin-top:11px;
      font-size:17px;
      line-height:1.5;
      font-weight:500;
      color:var(--mint);
      text-shadow:
        0 0 4px rgba(141,255,217,.8),
        0 0 13px rgba(141,255,217,.18);
    }

    #value.error{
      color:var(--red);
      text-shadow:
        0 0 4px rgba(255,128,144,.85),
        0 0 12px rgba(255,128,144,.25);
    }

    #progress{
      display:grid;
      grid-template-columns:1fr 40px;
      align-items:center;
      gap:10px;
      margin-top:17px;
    }

    .track{
      height:6px;
      border:1px solid rgba(141,255,217,.46);
      background:rgba(141,255,217,.035);
      overflow:hidden;
    }

    #bar{
      width:0%;
      height:100%;
      background:var(--mint);
      box-shadow:0 0 8px rgba(141,255,217,.48);
      transition:width .15s linear;
    }

    #percent{
      font-size:10px;
      color:var(--mint-dim);
    }

    /* scanlines */
    .scanlines,
    .noise,
    .vignette,
    .glass{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .scanlines{
      z-index:5;
      opacity:.34;
      background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.022) 0px,
        rgba(255,255,255,.022) 1px,
        rgba(0,0,0,.115) 2px,
        rgba(0,0,0,.115) 4px
      );
      animation:scanMove 8s linear infinite;
    }

    /* CSS-only fine grain: no image file needed */
    .noise{
      z-index:6;
      opacity:.18;
      mix-blend-mode:screen;
      background-image:
        radial-gradient(circle at 17% 23%,rgba(141,255,217,.08) 0 .45px,transparent .7px),
        radial-gradient(circle at 72% 41%,rgba(255,255,255,.055) 0 .42px,transparent .72px),
        radial-gradient(circle at 39% 78%,rgba(141,255,217,.065) 0 .5px,transparent .8px);
      background-size:7px 9px,11px 13px,13px 15px;
      animation:noiseMove .18s steps(2,end) infinite;
    }

    .vignette{
      z-index:7;
      background:radial-gradient(
        ellipse at center,
        transparent 34%,
        rgba(0,0,0,.18) 58%,
        rgba(0,0,0,.74) 100%
      );
    }

    .glass{
      z-index:8;
      opacity:.24;
      background:
        linear-gradient(104deg,
          transparent 0%,
          rgba(255,255,255,.038) 44%,
          transparent 60%);
    }

    #boot.shutdown .crt{
      animation:crtOff .82s cubic-bezier(.2,.72,.2,1) forwards;
    }

    .main-inner{
      width:100%;
      min-height:100vh;
      min-height:100dvh;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;

      padding:
        max(24px,env(safe-area-inset-top))
        24px
        max(24px,env(safe-area-inset-bottom));

      padding-top:18vh;

      text-align:center;

      opacity:0;
      transform:translateY(7px);
      animation:mainIn .9s ease forwards;

      text-shadow:
        0 2px 5px rgba(0,0,0,.75),
        0 0 10px rgba(0,0,0,.35);
    }

    .kicker{
      font-family:"JetBrains Mono",monospace;
      font-size:13px;
      color:rgba(255,255,255,.72);
      margin-bottom:20px;
    }

    #days{
      font-size:72px;
      line-height:1;
      font-weight:600;
      letter-spacing:-.05em;
    }

    .days-label{
      margin-top:7px;
      font-size:12px;
      color:rgba(255,255,255,.45);
    }

    #clock{
      margin-top:20px;
      font-size:29px;
      font-weight:500;
      letter-spacing:.07em;
    }

    @keyframes titleIn{
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes blink{
      0%,48%{opacity:1}
      49%,100%{opacity:0}
    }

    @keyframes screenLife{
      0%,100%{
        filter:brightness(.99);
        transform:perspective(850px) rotateX(.8deg) scaleX(.962) scaleY(1.018) translate(0,0);
      }
      46%{
        filter:brightness(1.012);
        transform:perspective(850px) rotateX(.8deg) scaleX(.962) scaleY(1.018) translate(.15px,-.1px);
      }
      49%{
        filter:brightness(.985);
        transform:perspective(850px) rotateX(.8deg) scaleX(.962) scaleY(1.018) translate(-.22px,.16px);
      }
    }

    @keyframes scanMove{
      from{background-position-y:0}
      to{background-position-y:44px}
    }

    @keyframes noiseMove{
      0%{transform:translate(0,0)}
      25%{transform:translate(-.7px,.3px)}
      50%{transform:translate(.5px,-.5px)}
      75%{transform:translate(-.3px,-.2px)}
      100%{transform:translate(0,0)}
    }

    @keyframes crtOff{
      0%{
        transform:perspective(850px) rotateX(.8deg) scaleX(.962) scaleY(1.018);
        filter:brightness(1);
        opacity:1;
      }
      46%{
        transform:perspective(850px) rotateX(.8deg) scaleX(1.04) scaleY(.04);
        filter:brightness(4.5);
        opacity:1;
      }
      72%{
        transform:perspective(850px) rotateX(.8deg) scaleX(.28) scaleY(.012);
        filter:brightness(7);
        opacity:1;
      }
      100%{
        transform:perspective(850px) rotateX(.8deg) scaleX(0) scaleY(0);
        opacity:0;
      }
    }

    @keyframes mainIn{
      to{opacity:1;transform:translateY(0)}
    }

    @media(max-width:380px){
      .content{padding-left:23px;padding-right:23px}
      .terminal{margin-top:68px}
      #status{font-size:12px}
      #value{font-size:16px}
    }
  </style>
</head>

<body>

  <section id="boot">
    <div class="crt">
      <div class="content">
        <h1 id="title">HỆ THỐNG GHÉP ĐÔI VŨ TRỤ</h1>

        <div class="terminal">
          <p id="status">
            <span class="prompt">&gt;</span><span id="statusText"></span><span id="cursor">▋</span>
          </p>

          <p id="value"></p>

          <div id="progress" class="hidden">
            <div class="track"><div id="bar"></div></div>
            <span id="percent">0%</span>
          </div>
        </div>
      </div>

      <div class="scanlines"></div>
      <div class="noise"></div>
      <div class="vignette"></div>
      <div class="glass"></div>
    </div>
  </section>

  <section id="main" class="hidden">
    <div class="main-inner">
      <p class="kicker">the universe has been right for</p>
      <div id="days">000</div>
      <div class="days-label">days</div>
      <div id="clock">00:00:00</div>
    </div>
  </section>

  <script>
    (() => {
      const boot = document.getElementById("boot");
      const main = document.getElementById("main");
      const statusText = document.getElementById("statusText");
      const value = document.getElementById("value");
      const cursor = document.getElementById("cursor");
      const progress = document.getElementById("progress");
      const bar = document.getElementById("bar");
      const percent = document.getElementById("percent");
      const days = document.getElementById("days");
      const clock = document.getElementById("clock");

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

      function setValue(text = "", isError = false) {
        value.textContent = text;
        value.classList.toggle("error", isError);
      }

      async function erase(speed = 12) {
        while (statusText.textContent.length > 0) {
          statusText.textContent = statusText.textContent.slice(0, -1);
          await sleep(speed);
        }
      }

      async function type(text, speed = 27) {
        statusText.textContent = "";
        for (const ch of text) {
          statusText.textContent += ch;
          let extra = 0;
          if (ch === "," || ch === ".") extra = 45;
          await sleep(speed + extra);
        }
      }

      async function change(text, options = {}) {
        const eraseSpeed = options.eraseSpeed ?? 11;
        const typeSpeed = options.typeSpeed ?? 34;
        const before = options.before ?? 180;
        const after = options.after ?? 680;

        await sleep(before);
        await erase(eraseSpeed);
        await type(text, typeSpeed);
        await sleep(after);
      }

      async function remainingPeople() {
        const numbers = [
          ["8.147.922.380", 210],
          ["5.902.471.013", 190],
          ["2.482.193", 220],
          ["151", 390],
          ["12", 540],
          ["3", 700],
          ["2", 820],
          ["1", 1150]
        ];

        for (const [number, delay] of numbers) {
          setValue("còn lại: " + number);
          await sleep(delay);
        }
      }

      async function heartSync() {
        progress.classList.remove("hidden");

        const values = [4, 11, 23, 39, 58, 72, 86, 94, 99, 100];

        for (const n of values) {
          bar.style.width = n + "%";
          percent.textContent = n + "%";
          await sleep(n >= 94 ? 330 : 165);
        }

        await sleep(550);
        progress.classList.add("hidden");
        bar.style.width = "0%";
        percent.textContent = "0%";
      }

      async function loveMeter() {
        const values = [
          ["38%", 170],
          ["127%", 165],
          ["541%", 155],
          ["2137%", 155],
          ["9999%", 185],
          ["∞", 700]
        ];

        for (const [text, delay] of values) {
          setValue(text);
          await sleep(delay);
        }

        setValue("LỖI", true);
        await sleep(900);

        setValue("đang thử lại...");
        await sleep(620);

        setValue("LỖI", true);
        await sleep(800);

        setValue("Yêu quá. Không đo được.");
        await sleep(1500);
      }

      function updateCounter() {
        const start = new Date("2026-08-05T00:00:00+07:00");
        let seconds = Math.max(0, Math.floor((Date.now() - start.getTime()) / 1000));

        const d = Math.floor(seconds / 86400);
        seconds %= 86400;

        const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
        seconds %= 3600;

        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");

        days.textContent = String(d).padStart(3, "0");
        clock.textContent = h + ":" + m + ":" + s;
      }

      async function finish() {
        cursor.style.visibility = "hidden";
        setValue("");
        await sleep(650);

        boot.classList.add("shutdown");
        await sleep(900);

        boot.classList.add("hidden");
        main.classList.remove("hidden");

        updateCounter();
        setInterval(updateCounter, 1000);
      }

      async function run() {
        await sleep(1050);

        await type("Đang khởi động hệ thống...", 42);
        await sleep(760);

        await change("Đang quét 8.147.922.381 con người...", {
          typeSpeed: 29,
          after: 980
        });

        await change("Đang loại bỏ các phương án không phù hợp...", {
          typeSpeed: 29,
          after: 300
        });

        await remainingPeople();
        await sleep(1150);
        setValue("");

        await change("Đang kiểm tra kết quả...", {
          typeSpeed: 34,
          after: 580
        });

        setValue("1 người phù hợp.");
        await sleep(1150);
        setValue("");

        await change("Đang đồng bộ trái tim...", {
          typeSpeed: 34,
          after: 300
        });

        await heartSync();
        setValue("Đồng bộ thành công.");
        await sleep(1050);
        setValue("");

        await change("Đang đo mức độ yêu...", {
          typeSpeed: 36,
          after: 300
        });

        await loveMeter();
        setValue("");

        await change("Đang xác nhận lần cuối...", {
          typeSpeed: 36,
          after: 800
        });

        setValue("...");
        await sleep(1250);
        setValue("");

        await change("Ôi. Cuối cùng cũng tìm đúng người rồi.", {
          eraseSpeed: 14,
          typeSpeed: 64,
          before: 0,
          after: 1950
        });

        await finish();
      }

      run().catch(err => {
        console.error(err);
        statusText.textContent = "Hệ thống gặp lỗi.";
        setValue("Nhưng vẫn tìm đúng người rồi.");
      });
    })();
  </script>
</body>
</html>
